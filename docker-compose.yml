version: '3.8'

services:
  opspilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opspilot-ai
    ports:
      - "8000:8080"
    environment:
      - DEMO_MODE=true
      - PORT=8080
      - SWYTCHCODE_API_KEY=${SWYTCHCODE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
